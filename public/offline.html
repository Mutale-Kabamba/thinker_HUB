<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · think.er HUB</title>
    <meta name="theme-color" content="#07191e">
    <link rel="icon" type="image/png" href="/images/logos/icon_green.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07191e;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }

        .wrap {
            max-width: 320px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            opacity: 0.9;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.02em;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f87171;
        }

        h1 {
            font-size: 1.125rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 0.825rem;
            color: #64748b;
            line-height: 1.5;
        }

        .btn {
            margin-top: 0.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.35rem;
            border-radius: 999px;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <main class="wrap">
        <img src="/images/logos/icon_green.png" alt="think.er HUB" class="logo">

        <div class="status" id="network-status">
            <span class="dot" id="network-dot"></span>
            <span id="network-label">Offline</span>
        </div>

        <div>
            <h1>No internet connection</h1>
            <p style="margin-top: 0.35rem;">Check your network connection. We'll reconnect automatically when you're back online.</p>
        </div>

        <button type="button" class="btn" onclick="window.location.reload();">
            Try again
        </button>
    </main>

    <script>
        window.addEventListener('online', function () {
            var dot = document.getElementById('network-dot');
            var label = document.getElementById('network-label');
            if (dot) dot.style.background = '#22c55e';
            if (label) {
                label.textContent = 'Reconnecting…';
                label.style.color = '#86efac';
            }
            setTimeout(function () {
                window.location.reload();
            }, 400);
        });
    </script>
</body>
</html>
