<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Connecting to think.er HUB</title>
    <meta name="theme-color" content="#006a67">
    <link rel="icon" type="image/png" href="/images/logos/icon_green.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #07191e;
            color: #e2f1f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing circles */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 106, 103, 0.45) 0%, rgba(7, 25, 30, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: rgba(16, 32, 40, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(45, 64, 72, 0.8);
            border-radius: 24px;
            padding: 2.25rem 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        .logo-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(145deg, #112a32, #0a1c22);
            border: 1px solid rgba(0, 106, 103, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 106, 103, 0.4);
        }

        .logo-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fca5a5;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1.5s ease infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #006a67, #008884);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(0, 106, 103, 0.6);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px -5px rgba(0, 106, 103, 0.8);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .footer-note {
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <main class="card">
        <div class="logo-wrap">
            <img src="/images/logos/icon_green.png" alt="think.er HUB" class="logo-img">
        </div>

        <div class="status-badge" id="network-status">
            <span class="status-dot"></span>
            <span>You are currently offline</span>
        </div>

        <div>
            <h1>Offline Workspace</h1>
            <p style="margin-top: 0.4rem;">
                think.er HUB is waiting for a network connection to sync your latest courses, badges, and claims.
            </p>
        </div>

        <button class="btn" onclick="window.location.reload();">
            <span>🔄 Reconnect Now</span>
        </button>

        <p class="footer-note">
            When your connection returns, the app will automatically resume.
        </p>
    </main>

    <script>
        window.addEventListener('online', function() {
            const statusEl = document.getElementById('network-status');
            if (statusEl) {
                statusEl.innerHTML = '<span class="status-dot" style="background:#22c55e;"></span><span style="color:#86efac;">Back Online! Reloading...</span>';
                statusEl.style.background = 'rgba(34, 197, 94, 0.15)';
                statusEl.style.borderColor = 'rgba(34, 197, 94, 0.3)';
            }
            setTimeout(function() {
                window.location.reload();
            }, 800);
        });
    </script>
</body>
</html>
